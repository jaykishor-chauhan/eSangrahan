<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Forget Password</title>
  
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      background: linear-gradient(to right, #00c6ff, #0072ff);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Poppins', sans-serif;
    }
    .card {
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.2);
      background: #fff;
    }
    .form-control {
      border-radius: 10px;
    }
    .btn-primary {
      border-radius: 10px;
      background-color: #007bff;
      border: none;
    }
    .btn-primary:hover {
      background-color: #0056b3;
    }
    .form-label {
      font-weight: 500;
    }
    .text-link {
      color: #007bff;
      text-decoration: none;
    }
    .text-link:hover {
      text-decoration: underline;
    }
  </style>

</head>
<body>

<div class="card">
  <h2 class="text-center mb-4">Forgot Password</h2>

  <form id="forgetPasswordForm">

    <!-- Email input -->
    <div class="mb-3" id="emailDiv">
      <label for="email" class="form-label">Registered Email</label>
      <input type="email" class="form-control" id="email" placeholder="Enter your registered email" required>
      <button type="button" id="sendOtpBtn" class="btn btn-primary w-100 mt-3">
        Send OTP
      </button>
    </div>

    <!-- OTP input -->
    <div class="mb-3" id="otpDiv" style="display:none;">
      <label for="otp" class="form-label">Enter OTP</label>
      <input type="text" class="form-control" id="otp" placeholder="Enter the OTP" required>
      <button type="button" id="verifyOtpBtn" class="btn btn-primary w-100 mt-3">
        Verify OTP
      </button>
    </div>

    <!-- New Password inputs -->
    <div id="passwordDiv" style="display:none;">
      <div class="mb-3">
        <label for="newPassword" class="form-label">New Password</label>
        <input type="password" class="form-control" id="newPassword" placeholder="Enter new password" required>
      </div>
      <div class="mb-3">
        <label for="confirmPassword" class="form-label">Confirm New Password</label>
        <input type="password" class="form-control" id="confirmPassword" placeholder="Confirm new password" required>
      </div>
      <button type="submit" id="resetPasswordBtn" class="btn btn-primary w-100 mt-3">
        Reset Password
      </button>
    </div>

  </form>

  <div class="text-center mt-3">
    <a href="login.html" class="text-link">Back to Login</a>
  </div>

</div>

<!-- Bootstrap 5 JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
// Simulate OTP generation
let generatedOtp = "";

// Step 1: Send OTP
document.getElementById('sendOtpBtn').addEventListener('click', function() {
  const emailInput = document.getElementById('email');
  const email = emailInput.value.trim();

  if (email === "") {
    alert('Please enter your email.');
    return;
  }

  // Send email to backend PHP script to generate and send OTP
  fetch('send_otp.php', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
    },
    body: JSON.stringify({ email: email })
  })
  .then(response => response.json())
  .then(data => {
    if (data.success) {
      alert('OTP sent to your registered email!');

      // Store the generated OTP in the variable
      generatedOtp = data.otp; 

      emailInput.disabled = true;
      document.getElementById('sendOtpBtn').style.display = 'none';
      document.getElementById('otpDiv').style.display = 'block';
    } else {
      alert('Failed to send OTP. Please try again later.');
    }
  })
  .catch(error => {
    console.error('Error:', error);
    alert('An error occurred while sending OTP.');
  });
});

// Step 2: Verify OTP
document.getElementById('verifyOtpBtn').addEventListener('click', function() {
  const enteredOtp = document.getElementById('otp').value.trim();
  if (enteredOtp == generatedOtp) {
    alert('OTP verified successfully!');
    document.getElementById('otp').disabled = true;
    document.getElementById('verifyOtpBtn').style.display = 'none';
    document.getElementById('passwordDiv').style.display = 'block';
  } else {
    alert('Invalid OTP. Please try again.');
  }
});

// Step 3: Reset Password
document.getElementById('forgetPasswordForm').addEventListener('submit', function(e) {
  e.preventDefault();

  const newPassword = document.getElementById('newPassword').value.trim();
  const confirmPassword = document.getElementById('confirmPassword').value.trim();

  if (newPassword === "" || confirmPassword === "") {
    alert('Please fill both password fields.');
    return;
  }

  if (newPassword !== confirmPassword) {
    alert('Passwords do not match.');
    return;
  }

  // Simulate password reset
  alert('Password reset successfully!');
  window.location.href = "login.html"; // Redirect to login
});
</script>

</body>
</html>
