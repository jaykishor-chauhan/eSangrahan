<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <!-- Bootstrap 5 CSS -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container">
      <!-- Login Modal -->
      <div
        class="modal fade"
        id="loginModal"
        data-bs-backdrop="static"
        data-bs-keyboard="false"
        tabindex="-1"
        aria-labelledby="loginModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content p-4 rounded">
            <h2 class="text-center mb-3">Login</h2>
            <form action="login.php" method="post">
              <div class="mb-3">
                <label for="userName" class="form-label">Username:</label>
                <input
                  type="text"
                  id="userName"
                  name="userName"
                  class="form-control"
                  placeholder="Enter your username"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password:</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-control"
                  placeholder="Enter your password"
                  required
                />
              </div>
              <div class="row">
                <div class="col text-center">
                  <button type="submit" class="btn btn-outline-success">
                    Login
                  </button>
                  <a
                    href="index.html"
                    type="button"
                    class="btn btn-outline-secondary"
                  >
                    Cancel
                  </a>
                </div>
              </div>
              <div class="row mt-2 mb-2 text-center">
                <p>
                  New user?
                  <a
                    href="#"
                    data-bs-toggle="modal"
                    data-bs-target="#signupModal"
                    data-bs-dismiss="modal"
                  >
                    Create an account</a
                  >
                </p>
              </div>
              <div class="modal-footer d-flex justify-content-center">
                <p class="m-0">&copy; 2025 eSangrahan. All rights reserved.</p>
              </div>
            </form>
          </div>
        </div>
      </div>

      <!-- Signup Modal -->
      <div
        class="modal fade"
        id="signupModal"
        data-bs-backdrop="static"
        data-bs-keyboard="false"
        tabindex="-1"
        aria-labelledby="signupModalLabel"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-dialog-centered">
          <div class="modal-content p-4">
            <h2 class="text-center mb-3">Create an Account</h2>
            <form action="signup.php" method="post">
              <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input
                  type="text"
                  id="firstName"
                  name="firstName"
                  class="form-control"
                  placeholder="Enter your first name"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input
                  type="text"
                  id="lastName"
                  name="lastName"
                  class="form-control"
                  placeholder="Enter your last name"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="userName" class="form-label">Username</label>
                <input
                  type="text"
                  id="userName"
                  name="userName"
                  class="form-control"
                  placeholder="Choose a username"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input
                  type="email"
                  id="email"
                  name="email"
                  class="form-control"
                  placeholder="Enter your email"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input
                  type="password"
                  id="password"
                  name="password"
                  class="form-control"
                  pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{8,}"
                  title="Password must contain at least one number, one uppercase and lowercase letter, and be at least 8 characters long."
                  placeholder="Enter your password"
                  required
                />
              </div>
              <div class="mb-3">
                <label for="repeatPassword" class="form-label"
                  >Repeat Password</label
                >
                <input
                  type="password"
                  id="repeatPassword"
                  name="repeatPassword"
                  class="form-control"
                  placeholder="Confirm your password"
                  required
                />
              </div>
              <div class="row tex-center">
                <div class="col text-center">
                  <button type="submit" class="btn btn-outline-success">
                    Sign Up
                  </button>
                  <a
                    href="index.html"
                    type="button"
                    class="btn btn-outline-secondary"
                  >
                    Cancel
                  </a>
                </div>
              </div>
              <div class="row text-center mt-2 mb-2">
                <p>
                  Already have an account?
                  <a
                    href="#"
                    data-bs-toggle="modal"
                    data-bs-target="#loginModal"
                    data-bs-dismiss="modal"
                  >
                    Login
                  </a>
                </p>
              </div>
            </form>
            <div class="modal-footer d-flex justify-content-center">
              <p class="m-0">&copy; 2025 eSangrahan. All rights reserved.</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Auto open login modal on page load -->
    <script>
      window.addEventListener("load", function () {
        const loginModal = new bootstrap.Modal(document.getElementById("loginModal"));
        loginModal.show();
      });
    </script>
  </body>
</html>
